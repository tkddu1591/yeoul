# 배포 설정 — Developer ID 서명·공증 + Universal 앱 + 자동 업데이트용 ZIP.
# 로컬 인증서 없는 패키징은 electron-builder.local.yml이 이 설정을 확장해 ad-hoc 서명으로 바꾼다.
appId: io.github.tkddu1591.yeoul
productName: Yeoul
artifactName: Yeoul-${version}-${arch}.${ext}
directories:
  output: dist
files:
  - out/**
  - package.json
  - "!node_modules/**"
  - node_modules/node-pty/**
asar: true
asarUnpack:
  - node_modules/node-pty/**
npmRebuild: false
mac:
  target:
    - dmg
    - zip
  icon: resources/icon.icns
  category: public.app-category.developer-tools
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  notarize: true
  # node-pty는 두 아키텍처의 prebuild를 양쪽 임시 앱에 함께 담는다. Universal 병합기는
  # 이미 아키텍처별 디렉터리로 분리된 바이너리를 다시 lipo하지 않고 그대로 보존해야 한다.
  x64ArchFiles: Contents/Resources/app.asar.unpacked/node_modules/node-pty/prebuilds/**
publish:
  provider: github
  owner: tkddu1591
  repo: yeoul-releases
  releaseType: release
