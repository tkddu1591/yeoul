name: 기능 제안
description: Git 또는 워크트리 흐름을 더 편하게 만들 아이디어를 제안해 주세요.
title: "[Feature] "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: 해결하려는 문제
      description: 현재 어떤 작업에서 불편을 겪는지 설명해 주세요.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 제안하는 흐름
      description: 버튼 이름보다 사용자가 어떤 순서로 무엇을 할 수 있어야 하는지 적어 주세요.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 현재 사용하는 대안
      description: 터미널 명령이나 다른 도구로 해결하고 있다면 함께 알려 주세요.
