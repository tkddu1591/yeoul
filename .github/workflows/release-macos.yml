name: macOS 릴리스

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: macos-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v4
        with:
          version: 10.24.0

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: 공개 바이너리 저장소 권한 확인
        env:
          GH_TOKEN: ${{ secrets.YEOUL_RELEASE_TOKEN }}
        run: |
          if test -z "$GH_TOKEN"; then
            echo "::error::YEOUL_RELEASE_TOKEN secret이 필요합니다."
            exit 1
          fi
          gh api repos/tkddu1591/yeoul-releases --jq '.full_name'

      - name: 릴리스 전제 확인
        id: signing
        env:
          MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          node scripts/verify-release-readiness.mjs "$GITHUB_REF_NAME"
          configured=0
          for name in MACOS_CERTIFICATE_P12_BASE64 MACOS_CERTIFICATE_PASSWORD APPLE_API_KEY_P8_BASE64 APPLE_API_KEY_ID APPLE_API_ISSUER; do
            test -z "${!name}" || configured=$((configured + 1))
          done
          if test "$configured" -eq 0; then
            echo "mode=adhoc" >> "$GITHUB_OUTPUT"
            echo "Developer ID 자격 증명이 없어 ad-hoc 공개 바이너리 릴리스로 진행합니다."
          elif test "$configured" -eq 5; then
            echo "mode=signed" >> "$GITHUB_OUTPUT"
            echo "Developer ID 서명·공증 릴리스로 진행합니다."
          else
            echo "::error::서명 자격 증명은 5개를 모두 등록하거나 모두 비워야 합니다."
            for name in MACOS_CERTIFICATE_P12_BASE64 MACOS_CERTIFICATE_PASSWORD APPLE_API_KEY_P8_BASE64 APPLE_API_KEY_ID APPLE_API_ISSUER; do
              test -n "${!name}" || echo "::error::누락된 secret: $name"
            done
            exit 1
          fi

      - name: 의존성 설치
        run: pnpm install --frozen-lockfile

      - name: 코드 검증
        run: |
          pnpm lint
          pnpm typecheck
          pnpm test

      - name: 서명·공증 자격 증명 준비
        if: steps.signing.outputs.mode == 'signed'
        env:
          MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          APPLE_API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
        run: |
          printf '%s' "$MACOS_CERTIFICATE_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/developer-id.p12"
          printf '%s' "$APPLE_API_KEY_P8_BASE64" | base64 --decode > "$RUNNER_TEMP/AuthKey.p8"
          chmod 600 "$RUNNER_TEMP/developer-id.p12" "$RUNNER_TEMP/AuthKey.p8"

      - name: Universal 앱 서명·공증 패키징
        if: steps.signing.outputs.mode == 'signed'
        env:
          GH_TOKEN: ${{ github.token }}
          CSC_LINK: ${{ runner.temp }}/developer-id.p12
          CSC_KEY_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY: ${{ runner.temp }}/AuthKey.p8
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: pnpm --filter @git-gui/desktop package:signed

      - name: Universal ad-hoc 패키징
        if: steps.signing.outputs.mode == 'adhoc'
        env:
          GH_TOKEN: ${{ github.token }}
        run: pnpm --filter @git-gui/desktop package

      - name: 패키지 대상 E2E
        run: pnpm --filter @git-gui/desktop e2e

      - name: 서명·공증 배포 산출물 검증
        if: steps.signing.outputs.mode == 'signed'
        env:
          GIT_GUI_VERIFY_RELEASE: "1"
        run: |
          node scripts/verify-app-bundle.mjs
          hdiutil verify "apps/desktop/dist/Yeoul-${GITHUB_REF_NAME#v}-universal.dmg"

      - name: ad-hoc 배포 산출물 검증
        if: steps.signing.outputs.mode == 'adhoc'
        run: |
          node scripts/verify-app-bundle.mjs
          hdiutil verify "apps/desktop/dist/Yeoul-${GITHUB_REF_NAME#v}-universal.dmg"

      - name: DMG SHA-512 생성
        run: |
          dmg="apps/desktop/dist/Yeoul-${GITHUB_REF_NAME#v}-universal.dmg"
          shasum -a 512 "$dmg" > "$dmg.sha512"

      - name: 검증 완료 산출물을 공개 바이너리 저장소에 업로드
        env:
          GH_TOKEN: ${{ secrets.YEOUL_RELEASE_TOKEN }}
          GH_REPO: tkddu1591/yeoul-releases
        run: |
          gh release view "$GITHUB_REF_NAME" --repo "$GH_REPO" >/dev/null 2>&1 || \
            gh release create "$GITHUB_REF_NAME" --repo "$GH_REPO" --target main \
              --title "여울 (Yeoul) $GITHUB_REF_NAME" \
              --notes-file "docs/releases/${GITHUB_REF_NAME}.md"
          gh release upload "$GITHUB_REF_NAME" --repo "$GH_REPO" \
            apps/desktop/dist/Yeoul-* apps/desktop/dist/latest-mac.yml --clobber
